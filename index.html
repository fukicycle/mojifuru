    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "もじふる",
        "url": "https://mojifuru.pages.dev/",
        "description": "上から降ってくるひらがなをタップして集め、制限時間内に単語を作ってスコアを競う無料のブラウザゲーム。",
        "applicationCategory": "GameApplication",

        "inLanguage": "ja",
        "image": "https://mojifuru.pages.dev/pwa-512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
    <script>
      // public/404.html でクエリ文字列に退避された元のパスを復元する
      // (GitHub PagesでSPAのルーティングを成立させるための対になる処理)。
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
