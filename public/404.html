<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>もじふる</title>
    <script>
      // GitHub Pagesは静的ホスティングのため、SPA(クライアントサイドルーティング)の
      // 深いパス(例: /mojifuru/wordlist)を直接開いたり再読み込みしたりすると
      // サーバー側にファイルが存在せず404になってしまう。
      // ここでは実際のパスをクエリ文字列に退避してトップページへリダイレクトし、
      // index.html側のスクリプトで元のURLへ復元する定番の回避策(spa-github-pages)を使う。
      // pathSegmentsToKeep はプロジェクトページのリポジトリ名セグメント数(/mojifuru/)。
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
