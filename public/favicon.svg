<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf9"></stop>
      <stop offset="100%" stop-color="#fff3e6"></stop>
    </linearGradient>
    <filter id="chipShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.8" flood-color="#6b3a20" flood-opacity="0.3"></feDropShadow>
    </filter>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#6b3a20" flood-opacity="0.24"></feDropShadow>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#bg)"></rect>
  <g filter="url(#dotShadow)">
    <circle cx="11" cy="12.2" r="5.8" fill="#ff5fa8"></circle>
    <circle cx="8.44" cy="9.3" r="1.4" fill="rgba(255,255,255,0.4)"></circle>
  </g>
  <g filter="url(#dotShadow)">
    <circle cx="52.2" cy="51.8" r="5" fill="#3fc9d6"></circle>
    <circle cx="50" cy="49.3" r="1.2" fill="rgba(255,255,255,0.4)"></circle>
  </g>
  <g transform="rotate(-6 32 32)">
    <circle cx="32" cy="32" r="21.8" fill="#ff9838" filter="url(#chipShadow)"></circle>
    <circle cx="21.3" cy="20" r="4.6" fill="rgba(255,255,255,0.35)"></circle>
    <text x="32" y="40.7" font-size="24.8" font-family="'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif" font-weight="700" text-anchor="middle" fill="#fff">も</text>
  </g>
</svg>