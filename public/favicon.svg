<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#fff3e6"/>
    </linearGradient>
    <filter id="chipShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.8" flood-color="#6b3a20" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#bg)"/>
  <g transform="rotate(-10 23.4 23.7)">
    <circle cx="23.4" cy="23.7" r="11.8" fill="#3fc9d6" filter="url(#chipShadow)"/>
    <circle cx="19.4" cy="19.2" r="2.6" fill="rgba(255,255,255,0.35)"/>
    <text x="23.4" y="28" font-size="12.4" font-family="'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif" font-weight="700" text-anchor="middle" fill="#fff">ふ</text>
  </g>
  <g transform="rotate(7 40.6 28.2)">
    <circle cx="40.6" cy="28.2" r="13.1" fill="#ff5fa8" filter="url(#chipShadow)"/>
    <circle cx="36.4" cy="23.5" r="2.9" fill="rgba(255,255,255,0.35)"/>
    <text x="40.6" y="33" font-size="13.8" font-family="'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif" font-weight="700" text-anchor="middle" fill="#fff">も</text>
  </g>
  <g transform="rotate(-5 32 43.8)">
    <circle cx="32" cy="43.8" r="14.4" fill="#ff9838" filter="url(#chipShadow)"/>
    <circle cx="27.4" cy="38.7" r="3.2" fill="rgba(255,255,255,0.35)"/>
    <text x="32" y="49.4" font-size="15.1" font-family="'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif" font-weight="700" text-anchor="middle" fill="#fff">じ</text>
  </g>
